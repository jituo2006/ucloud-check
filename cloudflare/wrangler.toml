# Public template. Personal deployment settings belong in ignored wrangler.local.toml.
name = "ucloud-check"
main = "worker.mjs"
compatibility_date = "2026-11-06"
workers_dev = true
send_metrics = false

[dev]
port = 8788

[assets]
directory = "../relay/web"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "ucloud-check"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[vars]
ENABLED = "false"
ENABLE_SIGNING = "false"
ENABLE_ATTENDANCE_MONITOR = "false"
ENABLE_ATTENDANCE_PROBE = "false"
AUTO_SIGN = "false"
SIGNING_PROTOCOL = "plugin"
UCLOUD_CLIENT_ID = "portal"
PUBLIC_BASE_URL = "https://your-worker.your-subdomain.workers.dev"
OPEN_STATUSES = ""
UNSIGNED_PATH = ""
UNSIGNED_VALUES = ""
DAY_START_HOUR = "7"
DAY_END_HOUR = "21"
IDLE_INTERVAL_MINUTES = "30"
PRECLASS_MINUTES = "10"
# Exact dated windows with explicit +08:00 timezone, populated after verifying the timetable.
CLASS_WINDOWS = "[]"
