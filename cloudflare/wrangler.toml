name = "ucloud-check"
main = "worker.mjs"
compatibility_date = "2026-11-06"
workers_dev = true
send_metrics = false

[dev]
port = 8788

[assets]
directory = "../relay/web"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "ucloud-check"
database_id = "f18e47d1-df29-4515-9545-e1042a7f4c86"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[vars]
ENABLED = "true"
ENABLE_SIGNING = "true"
ENABLE_ATTENDANCE_MONITOR = "true"
ENABLE_ATTENDANCE_PROBE = "false"
AUTO_SIGN = "true"
SIGNING_PROTOCOL = "plugin"
UCLOUD_CLIENT_ID = "portal"
PUBLIC_BASE_URL = "https://ucloud-check.studyhub-lab-7c42.workers.dev"
OPEN_STATUSES = ""
UNSIGNED_PATH = ""
UNSIGNED_VALUES = ""
DAY_START_HOUR = "7"
DAY_END_HOUR = "21"
IDLE_INTERVAL_MINUTES = "30"
PRECLASS_MINUTES = "10"
# Exact dated windows with explicit +08:00 timezone, populated after verifying the timetable.
CLASS_WINDOWS = "[]"
